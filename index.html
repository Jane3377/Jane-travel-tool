<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d9efe6">
<title>貞選旅管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&family=LXGW+WenKai+TC&family=Cubic+11&family=Klee+One&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link id="janeselectFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234A5D4E'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fffaf2'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

<!-- 登入 / 旅程清單 -->
<div id="loginView"   class="gateView noPrint hidden"></div>
<div id="tripListView" class="gateView noPrint hidden"></div>

<!-- 主 App -->
<div class="app hidden" id="mainApp">
  <header id="header">
    <div class="badge">J 貞選旅管家</div>
    <div class="titleRow">
      <h1 id="titleText">貞選旅管家</h1>
      <button class="iconBtn" onclick="editTitle()">✎</button>
    </div>
    <div class="subRow">
      <p class="sub" id="subtitleText"></p>
      <button class="iconBtn" onclick="editSubtitle()">✎</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="mobileTopNav" id="mobileTopNav"></div>
  <div id="setupStrip"></div>

  <div class="layout">
    <aside class="panel">
      <div class="section"><h3>旅行日曆</h3></div>
      <div class="hint">先看每天的安排，再進入當日行程調整。</div>
      <div id="days" style="margin-top:10px"></div>
      <div class="btns">
        <button class="btn danger" onclick="clearAllPlans()">清除行程</button>
      </div>
    </aside>
    <main class="main">
      <section id="tripView"></section>
      <section id="stayView"     class="hidden"></section>
      <section id="plannerView"  class="hidden"></section>
      <section id="spotsView"    class="hidden"></section>
      <section id="budgetView"   class="hidden"></section>
      <section id="packingView"  class="hidden"></section>
      <section id="photoBookView" class="hidden"></section>
      <section id="helpView"     class="hidden"></section>
    </main>
  </div>

  <footer>
    貞選旅管家 Janeselect Travel Manager<br>
    <strong id="footerVersion">版本：v69</strong>
  </footer>
</div>

<!-- 帳號 Widget -->
<div class="accountWidget noPrint" id="accountWidget">
  <button class="accountBtn" id="accountBtn" onclick="toggleAccountMenu()" title="帳號與同步">
    <span class="accountAvatar" id="accountAvatar">登入</span>
    <span class="accountLabel"  id="accountLabel">Google 登入</span>
  </button>
  <div class="accountMenu" id="accountMenu">
    <div class="who">
      <b id="accountName">尚未登入</b>
      <span id="accountEmail">登入後可跨裝置同步</span>
    </div>
    <button id="menuLogin"  onclick="firebaseSignIn(); closeAccountMenu()">Google 登入</button>
    <button id="menuLoad"   onclick="loadFromCloud({force:true}); closeAccountMenu()" style="display:none">載入雲端</button>
    <button id="menuSave"   onclick="saveToCloudNow(); closeAccountMenu()" style="display:none">立即同步</button>
    <button id="menuLogout" onclick="firebaseSignOut(); closeAccountMenu()" style="display:none">登出</button>
  </div>
</div>
<input type="file" id="backupFileInput" accept=".json" style="display:none" onchange="handleBackupFile(this)">
<div class="syncMini noPrint" id="syncMini">已同步</div>

<!-- 行動 nav -->
<nav class="mobile" id="mobile"></nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- FAB 浮動新增鈕 + 底部抽屜 -->
<button id="fabAdd" class="fabBtn fabHidden noPrint" onclick="openAddSheet()">＋</button>
<div id="addSheetOverlay" class="addSheetOverlay" hidden onclick="closeAddSheetOnBackdrop(event)">
  <div class="addSheet" id="addSheet">
    <div class="addSheetHandle"></div>
    <div class="addSheetHeader">
      <span id="addSheetTitle">新增</span>
      <button class="addSheetClose" onclick="closeAddSheet()">✕</button>
    </div>
    <div class="addSheetBody" id="addSheetBody"></div>
  </div>
</div>

<!-- Modals（靜態部分） -->
<div class="countryResetModal" id="countryResetModal">
  <div class="countryResetBox">
    <h3>⚠️ 修改旅遊國家</h3>
    <div class="box pink">切換國家會清空航班、住宿、行程等資料，建議先匯出備份。</div>
    <div class="btns">
      <button class="btn dark"   onclick="exportBackup()">先匯出備份</button>
      <button class="btn danger" onclick="confirmCountryReset()">確認清空並切換</button>
      <button class="btn soft"   onclick="cancelCountryReset()">取消</button>
    </div>
  </div>
</div>

<div class="optionModal" id="flightOptionModal">
  <div class="optionBox">
    <h3>✈️ 航班已儲存</h3>
    <div class="optionIntro">是否要把航班加入首尾行程？</div>
    <div class="toggleRow">
      <div><b>加入首尾行程</b><span>前往機場、搭乘航班、抵達後前往飯店等節點。</span></div>
      <label class="switch">
        <input id="flightOptionAddPlans" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="btns">
      <button class="btn dark" onclick="confirmFlightOptions()">確認</button>
      <button class="btn soft" onclick="closeFlightOptions()">先不要</button>
    </div>
  </div>
</div>

<div class="optionModal" id="hotelOptionModal">
  <div class="optionBox">
    <h3>🏨 住宿已新增</h3>
    <div class="optionIntro">是否同步帶入行程與費用？</div>
    <div class="toggleRow">
      <div><b>帶入行程</b><span>加入入住、出發、回飯店節點。</span></div>
      <label class="switch">
        <input id="hotelOptionAddPlans" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggleRow">
      <div><b>帶入費用</b><span>新增一筆住宿費用。</span></div>
      <label class="switch">
        <input id="hotelOptionAddBudget" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="btns">
      <button class="btn dark" onclick="confirmHotelOptions()">確認</button>
      <button class="btn soft" onclick="closeHotelOptions()">先不要</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

<!-- JS 模組（依賴順序）-->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/stay.js"></script>
<script src="js/planner.js"></script>
<script src="js/spots.js"></script>
<script src="js/budget.js"></script>
<script src="js/packing.js"></script>
<script src="js/photo.js"></script>
<script src="js/handbook.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
